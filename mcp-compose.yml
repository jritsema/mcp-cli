services:
  # default mcp servers

  time:
    command: uvx mcp-server-time --local-timezone=America/New_York
    labels:
      mcp.description: Get the current time for a configured timezone

  fetch:
    command: uvx mcp-server-fetch
    labels:
      mcp.description: Fetch and convert web content for LLM use

  # programming

  github:
    command: npx -y @modelcontextprotocol/server-github
    environment:
      GITHUB_PERSONAL_ACCESS_TOKEN: ${GITHUB_PERSONAL_ACCESS_TOKEN}
    labels:
      mcp.profile: programming
      mcp.description: Manage GitHub repositories, issues, pull requests, and code

  aws-docs:
    command: uvx awslabs.aws-documentation-mcp-server@latest
    environment:
      FASTMCP_LOG_LEVEL: "${FASTMCP_LOG_LEVEL}"
    labels:
      mcp.profile: programming
      mcp.description: Search and retrieve AWS documentation

  postgres:
    command: npx -y @modelcontextprotocol/server-postgres postgresql://localhost/mydb
    labels:
      mcp.profile: programming, database
      mcp.description: Query and manage the local PostgreSQL database

  # Container based MCP servers

  github-docker:
    image: ghcr.io/github/github-mcp-server
    environment:
      GITHUB_PERSONAL_ACCESS_TOKEN: ${GITHUB_PERSONAL_ACCESS_TOKEN}
    labels:
      mcp.profile: programming, docker
      mcp.description: Manage GitHub repositories, issues, pull requests, and code in Docker

  brave:
    image: mcp/brave-search
    environment:
      BRAVE_API_KEY: ${BRAVE_API_KEY}
    labels:
      mcp.profile: programming, research
      mcp.description: Search the web with Brave Search

  # Example with volume mounts
  filesystem:
    image: mcp/filesystem
    volumes:
      - ${HOME}/projects:/workspace:ro
      - /tmp:/tmp
    labels:
      mcp.profile: programming
      mcp.description: Read and manage files in the mounted workspace and /tmp
